name: AgentGuard Lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run lab
      - run: npx tsx lab/run.ts --mode verify
      - run: npx tsx lab/run.ts --mode replay
